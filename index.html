<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SanhubTV - Modern IPTV & Live DTH</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg: #070707;
      --panel: #111111;
      --card: #181818;
      --hover: #242424;
      --text: #ffffff;
      --muted: #a8a8a8;
      --border: #292929;
      --accent: #e50914;
    }
    
    body.light {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --card: #f0f0f0;
      --hover: #e0e0e0;
      --text: #111111;
      --muted: #666666;
      --border: #dddddd;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; }
    
    body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
    
    .dth-container { display: flex; flex-direction: column; height: 100vh; }
    
    .dth-header {
      background: rgba(17, 17, 17, 0.85);
      backdrop-filter: blur(20px);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }
    
    .dth-logo { font-size: 22px; font-weight: 800; color: var(--text); display: flex; align-items: center; gap: 8px; }
    .dth-logo span { color: var(--accent); }
    .dth-header-actions { display: flex; gap: 10px; align-items: center; }
    
    .dth-main { display: flex; flex: 1; overflow: hidden; position: relative; }
    
    .dth-sidebar {
      width: 280px; background: var(--panel); display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .dth-sidebar-header { padding: 14px; border-bottom: 1px solid var(--border); }
    .dth-sidebar-header h3 { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: 1px; }
    
    .dth-sidebar-content { flex: 1; overflow-y: auto; padding: 10px; }
    .dth-sidebar-content::-webkit-scrollbar { width: 4px; }
    .dth-sidebar-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    
    .auto-filter-section { margin-bottom: 12px; }
    .auto-filter-title { font-size: 10px; font-weight: 700; color: var(--muted); letter-spacing: 0.5px; margin: 8px 4px; }
    .auto-filter-list { display: flex; flex-direction: column; gap: 4px; }
    .auto-filter-btn {
      background: transparent; border: 1px solid transparent; color: var(--text);
      border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 500;
      cursor: pointer; text-align: left; transition: all 0.2s;
    }
    .auto-filter-btn:hover, .auto-filter-btn.active {
      background: var(--hover); border-color: var(--border); color: var(--accent);
    }
    
    .dth-content { flex: 1; display: flex; flex-direction: column; padding: 16px; overflow: hidden; background: var(--bg); }
    
    .dth-player-area {
      display: grid; grid-template-columns: 1fr 320px; gap: 16px; height: 420px; flex: 0 0 420px;
    }
    
    .dth-video-section {
      background: #000; border-radius: 16px; overflow: hidden; position: relative;
      border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .dth-video-section video { width: 100%; height: 100%; object-fit: contain; }
    
    .watch-time-badge {
      position: absolute; top: 14px; right: 14px; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px); color: #fff; padding: 6px 12px; border-radius: 20px;
      font-size: 11px; display: flex; align-items: center; gap: 6px; border: 1px solid rgba(255,255,255,0.1);
    }
    .live-dot { width: 6px; height: 6px; background: var(--accent); border-radius: 50%; animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    .vlc-controls {
      display: flex; align-items: center; gap: 8px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; margin-top: 12px;
    }
    .vlc-btn {
      background: var(--card); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;
      transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .vlc-btn:hover { background: var(--hover); border-color: var(--accent); color: var(--accent); }
    
    .live-channel-panel {
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .live-channel-title {
      padding: 14px; border-bottom: 1px solid var(--border); font-size: 12px; font-weight: 700; color: var(--muted);
      display: flex; justify-content: space-between; align-items: center;
    }
    .live-channel-list { flex: 1; overflow-y: auto; padding: 8px; }
    .live-channel-item {
      display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px;
      margin-bottom: 4px; background: transparent; border: 1px solid transparent;
      border-radius: 10px; color: var(--text); cursor: pointer; text-align: left;
    }
    .live-channel-item:hover, .live-channel-item.active { background: var(--hover); border-color: var(--border); }
    .live-channel-item img { width: 36px; height: 36px; object-fit: contain; background: #fff; border-radius: 8px; padding: 2px; }
    
    .channel-list-toolbar { display: flex; justify-content: space-between; align-items: center; margin: 16px 0 10px; }
    .folder-channel-heading { font-size: 16px; font-weight: 700; }
    
    .dth-channel-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px; overflow-y: auto; flex: 1; padding: 4px;
    }
    
    .dth-channel-card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
      padding: 14px; text-align: center; cursor: pointer; transition: all 0.25s;
      position: relative; display: flex; flex-direction: column; align-items: center;
    }
    .dth-channel-card:hover { transform: translateY(-4px); border-color: var(--accent); background: var(--hover); }
    .dth-channel-logo { width: 54px; height: 54px; object-fit: contain; background: #fff; border-radius: 12px; padding: 6px; margin-bottom: 10px; }
    .dth-channel-number { position: absolute; top: 10px; left: 10px; background: var(--card); color: var(--muted); font-size: 10px; padding: 2px 6px; border-radius: 6px; }
    .dth-channel-title { font-size: 12px; font-weight: 600; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dth-channel-group { font-size: 10px; color: var(--muted); margin-top: 2px; }

    .dth-btn {
      background: var(--accent); color: #fff; border: none; padding: 8px 16px;
      border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px;
      transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px;
    }
    .dth-btn:hover { opacity: 0.9; }
    .dth-input {
      width: 100%; padding: 10px 14px; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px;
    }
    
    .dth-toast {
      position: fixed; bottom: 24px; right: 24px; background: var(--panel);
      border: 1px solid var(--border); color: var(--text); padding: 12px 20px;
      border-radius: 12px; display: none; z-index: 2000; font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .dth-toast.show { display: block; }

    @media(max-width: 900px) {
      .dth-main { flex-direction: column; }
      .dth-sidebar { width: 100%; height: 140px; }
      .dth-player-area { grid-template-columns: 1fr; height: auto; }
      .live-channel-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="dth-container">
    <div class="dth-header">
      <div class="dth-logo">📺 <span>SanhubTV</span> IPTV</div>
      <div class="dth-header-actions">
        <button class="dth-btn" onclick="downloadM3UFile()">📥 Download VLC Playlist (.m3u)</button>
        <button class="dth-btn" style="background:var(--card); color:var(--text); border:1px solid var(--border);" onclick="toggleTheme()">🌓 Theme</button>
      </div>
    </div>
    
    <div class="dth-main">
      <div class="dth-sidebar">
        <div class="dth-sidebar-header"><h3>CATEGORIES</h3></div>
        <div class="dth-sidebar-content" id="sidebarContent">
          <div class="auto-filter-section">
            <div class="auto-filter-title">QUICK ACCESS</div>
            <div class="auto-filter-list" id="quickFolderList"></div>
          </div>
          <div class="auto-filter-section">
            <div class="auto-filter-title">GENRES</div>
            <div class="auto-filter-list" id="categoryFolderList"></div>
          </div>
        </div>
      </div>
      
      <div class="dth-content">
        <div class="dth-player-area">
          <div class="dth-video-section">
            <video id="videoPlayer" controls playsinline></video>
            <div class="watch-time-badge">
              <span class="live-dot"></span>
              <span id="watchTime">00:00</span>
            </div>
          </div>
          <div class="live-channel-panel">
            <div class="live-channel-title">
              <span>LIVE STREAMS</span>
              <span id="totalLiveCount">0</span>
            </div>
            <div class="live-channel-list" id="liveChannelList"></div>
          </div>
        </div>
        
        <div class="vlc-controls">
          <button class="vlc-btn" onclick="playInExternalVLC()">⚡ Open Current in VLC App</button>
          <span style="flex:1"></span>
          <button class="vlc-btn" onclick="if(videoPlayer.requestFullscreen) videoPlayer.requestFullscreen()">⛶ Fullscreen</button>
        </div>
        
        <div class="channel-list-toolbar">
          <div class="folder-channel-heading" id="channelFolderHeading">All Channels</div>
          <input type="text" id="searchBox" class="dth-input" placeholder="Search channels..." style="max-width: 240px; padding: 6px 12px;" oninput="searchChannels()">
        </div>
        
        <div class="dth-channel-grid" id="channelGrid"></div>
      </div>
    </div>
  </div>
  
  <div class="dth-toast" id="toast"></div>

  <script>
    const DEFAULT_PLAYLIST = 'https://iptv-org.github.io/iptv/countries/in.m3u';
    let allChannels = [];
    let currentChannel = null;
    let activeCategory = 'All';
    let hlsPlayer = null;

    function initApp() {
      fetchPlaylist();
    }

    async function fetchPlaylist() {
      showToast('📡 Fetching playlist channels...');
      try {
        const res = await fetch(DEFAULT_PLAYLIST);
        const text = await res.text();
        allChannels = parseM3U(text);
        buildCategories();
        renderChannels();
        renderLiveList();
        showToast('✅ Channels Loaded Successfully');
      } catch(e) {
        showToast('❌ Failed to load playlist');
      }
    }

    function parseM3U(content) {
      const lines = content.replace(/\r/g, '').split('\n');
      const channels = [];
      let current = {};
      let count = 1;

      for (let line of lines) {
        line = line.trim();
        if (line.startsWith('#EXTINF')) {
          const nameMatch = line.match(/,(.+)$/);
          const logoMatch = line.match(/tvg-logo="([^"]*)"/);
          const groupMatch = line.match(/group-title="([^"]*)"/);
          current = {
            id: 'ch_' + count++,
            name: nameMatch ? nameMatch[1] : 'Channel ' + count,
            logo: logoMatch ? logoMatch[1] : '',
            group: groupMatch ? groupMatch[1] : 'General'
          };
        } else if (line && !line.startsWith('#')) {
          current.url = line;
          if (current.url) channels.push(current);
          current = {};
        }
      }
      return channels;
    }

    function buildCategories() {
      const quickList = document.getElementById('quickFolderList');
      const catList = document.getElementById('categoryFolderList');
      
      quickList.innerHTML = `
        <button class="auto-filter-btn active" onclick="filterCategory('All', this)">📺 All Channels (${allChannels.length})</button>
        <button class="auto-filter-btn" onclick="filterCategory('Movies', this)">🎬 Movies</button>
        <button class="auto-filter-btn" onclick="filterCategory('Sports', this)">⚽ Sports</button>
        <button class="auto-filter-btn" onclick="filterCategory('News', this)">📰 News</button>
      `;

      const groups = [...new Set(allChannels.map(ch => ch.group))].sort();
      catList.innerHTML = '';
      groups.forEach(group => {
        const btn = document.createElement('button');
        btn.className = 'auto-filter-btn';
        btn.textContent = '📁 ' + group;
        btn.onclick = () => filterCategory(group, btn);
        catList.appendChild(btn);
      });
    }

    function filterCategory(category, el) {
      activeCategory = category;
      document.querySelectorAll('.auto-filter-btn').forEach(b => b.classList.remove('active'));
      if(el) el.classList.add('active');
      renderChannels();
    }

    function renderChannels() {
      const grid = document.getElementById('channelGrid');
      const heading = document.getElementById('channelFolderHeading');
      grid.innerHTML = '';
      
      heading.textContent = activeCategory === 'All' ? 'All Channels' : activeCategory;
      
      let filtered = allChannels;
      if (activeCategory !== 'All') {
        filtered = allChannels.filter(ch => ch.group.toLowerCase().includes(activeCategory.toLowerCase()) || (activeCategory === 'Movies' && ch.name.toLowerCase().includes('movie')));
      }

      filtered.slice(0, 100).forEach((ch, idx) => {
        const card = document.createElement('div');
        card.className = 'dth-channel-card';
        card.innerHTML = `
          <div class="dth-channel-number">#${idx + 1}</div>
          <img class="dth-channel-logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/54/181818/ffffff?text=TV'">
          <div class="dth-channel-title">${ch.name}</div>
          <div class="dth-channel-group">${ch.group}</div>
        `;
        card.onclick = () => playChannel(ch);
        grid.appendChild(card);
      });
    }

    function renderLiveList() {
      const list = document.getElementById('liveChannelList');
      document.getElementById('totalLiveCount').textContent = allChannels.length;
      list.innerHTML = '';
      
      allChannels.slice(0, 50).forEach(ch => {
        const item = document.createElement('button');
        item.className = 'live-channel-item';
        item.innerHTML = `
          <img src="${ch.logo}" onerror="this.src='https://via.placeholder.com/36/181818/ffffff?text=TV'">
          <div style="flex:1; overflow:hidden;">
            <div style="font-weight:600; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${ch.name}</div>
            <div style="font-size:10px; color:var(--muted);">${ch.group}</div>
          </div>
        `;
        item.onclick = () => playChannel(ch);
        list.appendChild(item);
      });
    }

    function playChannel(ch) {
      currentChannel = ch;
      const video = document.getElementById('videoPlayer');
      
      if (hlsPlayer) {
        hlsPlayer.destroy();
        hlsPlayer = null;
      }

      showToast('▶ Playing: ' + ch.name);

      if (Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(ch.url);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else {
        video.src = ch.url;
        video.play().catch(() => {});
      }
    }

    // VLC Playlist Downloader Generator
    function downloadM3UFile() {
      if (allChannels.length === 0) {
        showToast('⚠️ Channels load hone dein pehle!');
        return;
      }
      
      let m3uContent = '#EXTM3U\n';
      allChannels.forEach(ch => {
        m3uContent += `#EXTINF:-1 tvg-logo="${ch.logo}" group-title="${ch.group}",${ch.name}\n`;
        m3uContent += `${ch.url}\n`;
      });
      
      const blob = new Blob([m3uContent], { type: 'audio/x-mpegurl' });
      const link = document.createElement('a');
      link.href = window.URL.createObjectURL(blob);
      link.download = 'SanhubTV_Playlist.m3u';
      link.click();
      showToast('✅ M3U Playlist Downloaded! VLC mein open karein.');
    }

    function playInExternalVLC() {
      if (!currentChannel) {
        showToast('⚠️ Pehle koi channel select karein!');
        return;
      }
      // VLC deep link schema
      window.location.href = `vlc://${currentChannel.url}`;
    }

    function searchChannels() {
      const query = document.getElementById('searchBox').value.toLowerCase();
      const grid = document.getElementById('channelGrid');
      grid.innerHTML = '';

      const filtered = allChannels.filter(ch => ch.name.toLowerCase().includes(query));
      filtered.slice(0, 100).forEach((ch, idx) => {
        const card = document.createElement('div');
        card.className = 'dth-channel-card';
        card.innerHTML = `
          <div class="dth-channel-number">#${idx + 1}</div>
          <img class="dth-channel-logo" src="${ch.logo}" onerror="this.src='https://via.placeholder.com/54/181818/ffffff?text=TV'">
          <div class="dth-channel-title">${ch.name}</div>
          <div class="dth-channel-group">${ch.group}</div>
        `;
        card.onclick = () => playChannel(ch);
        grid.appendChild(card);
      });
    }

    function toggleTheme() {
      document.body.classList.toggle('light');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }

    window.onload = initApp;
  </script>
</body>
</html>
